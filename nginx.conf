server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    # Tell Plone's VirtualHostMonster the real external URL so CSRF tokens
    # and redirects are generated correctly.
    location /senaite/ {
        rewrite ^/senaite/(.*)$
            /VirtualHostBase/https/$http_host:443/senaite/VirtualHostRoot/$1
            break;

        proxy_pass          http://senaite:8080;
        proxy_http_version  1.0;

        proxy_set_header    Host              $host;
        proxy_set_header    Connection        "";
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        proxy_request_buffering on;
        proxy_buffering         on;
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 30s;
    }

    # Redirect bare root to /senaite/
    location = / {
        return 302 /senaite/;
    }
}
