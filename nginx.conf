# The session cookie is Secure only when the visitor came over HTTPS (the
# tunnel sets X-Forwarded-Proto); plain-HTTP access on the bench network
# would otherwise lose its sign-in.
map $http_x_forwarded_proto $pfas_cookie_secure {
    https   secure;
    default "";
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    # pages and their data are sent compressed (the Calibration Archive was
    # 2 MB of HTML on the wire)
    gzip            on;
    gzip_proxied    any;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json text/plain image/svg+xml;

    # Tell Plone's VirtualHostMonster the real external URL so CSRF tokens
    # and redirects are generated correctly.
    location /senaite/ {
        rewrite ^/senaite/(.*)$
            /VirtualHostBase/https/$http_host:443/VirtualHostRoot/senaite/$1
            break;

        proxy_pass          http://senaite:8080;
        proxy_http_version  1.0;

        proxy_set_header    Host              $host;
        proxy_set_header    Connection        "";
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # SameSite=Lax: another site's page cannot POST with the session
        proxy_cookie_flags  __ac httponly samesite=lax $pfas_cookie_secure;
        add_header          X-Content-Type-Options nosniff always;
        add_header          Referrer-Policy same-origin always;
        # a policy the pages' inline scripts can live with: no plugins, no
        # foreign <base>, no framing by another site
        add_header          Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

        proxy_request_buffering on;
        proxy_buffering         on;
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 30s;
    }

    # Proxy Plone resource directories (++plone++, ++resource++) directly.
    # CSS bundles use absolute paths like /++plone++.../fonts/... so nginx
    # must proxy these even though they lack the /senaite/ prefix.
    location ~ ^/\+\+ {
        proxy_pass          http://senaite:8080;
        proxy_http_version  1.0;
        proxy_set_header    Host              $host;
        proxy_set_header    Connection        "";
        proxy_read_timeout  60s;
    }

    # Redirect bare root to /senaite/
    location = / {
        return 302 /senaite/;
    }
}
